name: CI
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  vet:
    runs-on: "ubuntu-22.04"
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

  secure:
    runs-on: "ubuntu-22.04"
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Gosec
        run: make gosec

  check-license:
    runs-on: "ubuntu-22.04"
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check License Headers
        run: make check-license

  lint:
    runs-on: "ubuntu-22.04"
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        run: make lint

  misspell:
    runs-on: "ubuntu-22.04"
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Misspell
        run: make misspell

  test-end-to-end:
    runs-on: "ubuntu-22.04"
    strategy:
      fail-fast: false
      matrix:
        bindplane_version:
          - "latest"
          - "v1.104.0"
          - "v1.96.0"
          - "v1.93.0"
          - "v1.89.3"

          #  v1.70.0 introduced v2 config and routes behind a feature flag
          # There were some growing pains and bugs. v1.76.0 is consider the
          # minimum supported server version for the provider.
          - "v1.76.0"
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - uses: KengoTODA/actions-setup-docker-compose@main
        with:
          version: '2.7.0'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: make test-end-to-end
        env:
          BINDPLANE_VERSION: ${{ matrix.bindplane_version }}
          BINDPLANE_LICENSE: ${{ secrets.BINDPLANE_LICENSE }}

      - run: go tool goreleaser --version
        if: always()

      - run: tree dist/
        if: always()

      - name: list images (debug)
        if: always()
        run: docker images

  test-local:
    runs-on: "ubuntu-22.04"
    strategy:
      matrix:
        bindplane_version:
          - "latest"

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - uses: KengoTODA/actions-setup-docker-compose@main
        with:
          version: '2.7.0'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # https://bindplane.com/download
      - name: Start Bindplane
        run: |
          cat <<EOF > docker-compose.yml
          version: "3"
          volumes:
            bindplane:
          services:
            transform:
              container_name: bindplane-transform-agent
              restart: always
              image: ghcr.io/observiq/bindplane-transform-agent:latest
              ports:
                - "4568:4568"
            bindplane:
              container_name: bindplane-server
              restart: always
              image: ghcr.io/observiq/bindplane-ee:${VERSION}
              ports:
                - "3001:3001"
              environment:
                - BINDPLANE_USERNAME=admin
                - BINDPLANE_PASSWORD=password
                - BINDPLANE_REMOTE_URL=http://localhost:3001
                - BINDPLANE_SESSION_SECRET=2c23c9d3-850f-4062-a5c8-3f9b814ae144
                - BINDPLANE_LOG_OUTPUT=stdout
                - BINDPLANE_ACCEPT_EULA=true
                - BINDPLANE_TRANSFORM_AGENT_ENABLE_REMOTE=true
                - BINDPLANE_TRANSFORM_AGENT_REMOTE_AGENTS=transform:4568
                - BINDPLANE_LICENSE=${BINDPLANE_LICENSE}
                - BINDPLANE_POSTGRES_HOST=bindplane-postgres
                - BINDPLANE_POSTGRES_PORT=5432
                - BINDPLANE_POSTGRES_DATABASE=bindplane
                - BINDPLANE_POSTGRES_USERNAME=bindplane
                - BINDPLANE_POSTGRES_PASSWORD=password
              volumes:
                - bindplane:/data
              depends_on:
                - transform
                - postgres
            postgres:
              container_name: bindplane-postgres
              restart: always
              image: postgres:16
              ports:
                - "5432:5432"
              environment:
                - POSTGRES_DB=bindplane
                - POSTGRES_PASSWORD=password
                - POSTGRES_USER=bindplane
          EOF
          docker-compose up -d
        env:
          BINDPLANE_LICENSE: ${{ secrets.BINDPLANE_LICENSE }}
          VERSION: ${{ matrix.bindplane_version }}

      - name: Init Bindplane Organization
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 1
          polling_interval_seconds: 2
          max_attempts: 3
          shell: bash
          command: |
            curl \
              -u admin:password http://localhost:3001/v1/organizations \
              -X POST -d '{"organizationName": "init", "accountName": "project", "eulaAccepted":true}' -v

      # Allow bindplane to seed the database by making a GET request
      # and waiting 20 seconds.
      - name: Trigger Seeding
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 1
          polling_interval_seconds: 2
          max_attempts: 3
          shell: bash
          command: |
            curl -v -u admin:password http://localhost:3001/v1/source-types
            sleep 20
    
      - name: Get docker compose config (debug)
        if: always()
        run: cat docker-compose.yml | grep -v BINDPLANE_LICENSE

      - name: Build provider for local testing
        run: make test-local

      - name: run local tests
        run: TF_CLI_CONFIG_FILE=./dev.tfrc terraform apply -auto-approve
        working-directory: test/local

      - name: run import tests
        env:
          TF_CLI_CONFIG_FILE: ./dev.tfrc
        run: chmod +x test-import.sh && ./test-import.sh
        working-directory: test/local

      - name: cleanup local tests
        run: TF_CLI_CONFIG_FILE=./dev.tfrc terraform destroy -auto-approve
        working-directory: test/local

      - name: prep example/
        run: |
          cp test/local/dev.tfrc example/
          cp -r test/local/providers example/

      - name: apply example resources
        run: TF_CLI_CONFIG_FILE=./dev.tfrc terraform apply -auto-approve
        working-directory: example/

      - name: cleanup example resources
        run: TF_CLI_CONFIG_FILE=./dev.tfrc terraform destroy -auto-approve
        working-directory: example/

      - run: go tool goreleaser --version
        if: always()

      - run: tree dist/
        if: always()

      - name: list images (debug)
        if: always()
        run: docker images

      - name: list containers (debug)
        if: always()
        run: docker ps

      - name: bindplane logs (debug)
        if: always()
        run: docker logs bindplane-server

      - name: postgres logs (debug)
        if: always()
        run: docker logs bindplane-postgres

  test-local-tls:
    runs-on: "ubuntu-22.04"
    strategy:
      matrix:
        bindplane_version:
          - "latest"

    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - uses: KengoTODA/actions-setup-docker-compose@main
        with:
          version: '2.7.0'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate self-signed TLS certificate
        run: |
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout /tmp/bindplane.key -out /tmp/bindplane.crt \
            -days 365 -subj "/CN=localhost" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost"
          chmod 644 /tmp/bindplane.key /tmp/bindplane.crt

      # https://bindplane.com/download
      - name: Start Bindplane
        run: |
          cat <<EOF > docker-compose.yml
          version: "3"
          volumes:
            bindplane:
          services:
            transform:
              container_name: bindplane-transform-agent
              restart: always
              image: ghcr.io/observiq/bindplane-transform-agent:latest
              ports:
                - "4568:4568"
            bindplane:
              container_name: bindplane-server
              restart: always
              image: ghcr.io/observiq/bindplane-ee:${VERSION}
              ports:
                - "3001:3001"
              environment:
                - BINDPLANE_USERNAME=admin
                - BINDPLANE_PASSWORD=password
                - BINDPLANE_REMOTE_URL=https://localhost:3001
                - BINDPLANE_SESSION_SECRET=2c23c9d3-850f-4062-a5c8-3f9b814ae144
                - BINDPLANE_LOG_OUTPUT=stdout
                - BINDPLANE_ACCEPT_EULA=true
                - BINDPLANE_TRANSFORM_AGENT_ENABLE_REMOTE=true
                - BINDPLANE_TRANSFORM_AGENT_REMOTE_AGENTS=transform:4568
                - BINDPLANE_LICENSE=${BINDPLANE_LICENSE}
                - BINDPLANE_POSTGRES_HOST=bindplane-postgres
                - BINDPLANE_POSTGRES_PORT=5432
                - BINDPLANE_POSTGRES_DATABASE=bindplane
                - BINDPLANE_POSTGRES_USERNAME=bindplane
                - BINDPLANE_POSTGRES_PASSWORD=password
                - BINDPLANE_TLS_CERT=/bindplane.crt
                - BINDPLANE_TLS_KEY=/bindplane.key
              volumes:
                - bindplane:/data
                - /tmp/bindplane.crt:/bindplane.crt:ro
                - /tmp/bindplane.key:/bindplane.key:ro
              depends_on:
                - transform
                - postgres
            postgres:
              container_name: bindplane-postgres
              restart: always
              image: postgres:16
              ports:
                - "5432:5432"
              environment:
                - POSTGRES_DB=bindplane
                - POSTGRES_PASSWORD=password
                - POSTGRES_USER=bindplane
            # TLS 1.2-only proxy in front of Bindplane, standing in for a
            # load balancer that does not support TLS 1.3 (issue #195).
            tls12-proxy:
              container_name: bindplane-tls12-proxy
              restart: always
              image: nginx:1.27.5-alpine
              ports:
                - "3002:3002"
              volumes:
                - ./test/local-tls12/nginx.conf:/etc/nginx/nginx.conf:ro
                - /tmp/bindplane.crt:/etc/nginx/tls/bindplane.crt:ro
                - /tmp/bindplane.key:/etc/nginx/tls/bindplane.key:ro
              depends_on:
                - bindplane
          EOF
          docker-compose up -d
        env:
          BINDPLANE_LICENSE: ${{ secrets.BINDPLANE_LICENSE }}
          VERSION: ${{ matrix.bindplane_version }}

      - name: Init Bindplane Organization
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 1
          polling_interval_seconds: 2
          max_attempts: 3
          shell: bash
          command: |
            curl -k \
              -u admin:password https://localhost:3001/v1/organizations \
              -X POST -d '{"organizationName": "init", "accountName": "project", "eulaAccepted":true}' -v

      # Allow bindplane to seed the database by making a GET request
      # and waiting 20 seconds.
      - name: Trigger Seeding
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 1
          polling_interval_seconds: 2
          max_attempts: 3
          shell: bash
          command: |
            curl -k -v -u admin:password https://localhost:3001/v1/source-types
            sleep 20

      - name: Get docker compose config (debug)
        if: always()
        run: cat docker-compose.yml | grep -v BINDPLANE_LICENSE

      - name: Build provider for local testing
        run: make test-local

      - name: Copy provider to local-tls directory
        run: cp -r test/local/providers test/local-tls/providers

      - name: run local-tls tests
        run: TF_CLI_CONFIG_FILE=./dev.tfrc terraform apply -auto-approve
        working-directory: test/local-tls

      - name: cleanup local-tls tests
        run: TF_CLI_CONFIG_FILE=./dev.tfrc terraform destroy -auto-approve
        working-directory: test/local-tls

      - name: Check TLS 1.2 proxy refuses TLS 1.3
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 1
          polling_interval_seconds: 2
          max_attempts: 3
          shell: bash
          command: |
            set -e
            echo | openssl s_client -connect localhost:3002 -tls1_2 -CAfile /tmp/bindplane.crt -verify_return_error
            if echo | openssl s_client -connect localhost:3002 -tls1_3; then
              echo "proxy accepted TLS 1.3, expected TLS 1.2 only"
              exit 1
            fi
            curl -sf --cacert /tmp/bindplane.crt -u admin:password https://localhost:3002/v1/version

      - name: Copy provider to local-tls12 directory
        run: cp -r test/local/providers test/local-tls12/providers

      - name: local-tls12 apply with default tls_min_version must fail
        working-directory: test/local-tls12
        run: |
          set +e
          TF_CLI_CONFIG_FILE=./dev.tfrc terraform apply -auto-approve -no-color 2>&1 | tee apply.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "apply succeeded through the TLS 1.2-only proxy with the default tls_min_version, expected failure"
            exit 1
          fi
          grep -E "protocol version not supported|handshake|EOF" apply.log

      - name: local-tls12 apply with tls_min_version 1.2
        run: TF_CLI_CONFIG_FILE=./dev.tfrc terraform apply -auto-approve -var tls_min_version=1.2
        working-directory: test/local-tls12

      - name: local-tls12 second plan must be clean
        run: TF_CLI_CONFIG_FILE=./dev.tfrc terraform plan -detailed-exitcode -var tls_min_version=1.2
        working-directory: test/local-tls12

      - name: cleanup local-tls12 tests
        if: always()
        run: TF_CLI_CONFIG_FILE=./dev.tfrc terraform destroy -auto-approve -var tls_min_version=1.2
        working-directory: test/local-tls12

      - run: go tool goreleaser --version
        if: always()

      - run: tree dist/
        if: always()

      - name: list images (debug)
        if: always()
        run: docker images

      - name: list containers (debug)
        if: always()
        run: docker ps

      - name: bindplane logs (debug)
        if: always()
        run: docker logs bindplane-server

      - name: postgres logs (debug)
        if: always()
        run: docker logs bindplane-postgres

      - name: tls12 proxy logs (debug)
        if: always()
        run: docker logs bindplane-tls12-proxy

  build:
    # Skip build for dependabot. It takes long and requires our GPG
    # key. The `test-end-to-end` job will test building the binary.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: "ubuntu-22.04"
    steps:
      - name: Check out source code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Import GPG key
        id: import_gpg
        uses: paultyng/ghaction-import-gpg@v2.1.0
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}
  
      - name: Test GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.1.0
          args: release --snapshot --skip=publish --clean --parallelism 2 --config release/goreleaser.yml
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Scan Binaries
        run: go tool lichen --config=./license.yaml $(find dist/provider_* -type f | grep terraform-provider-bindplane | xargs)
