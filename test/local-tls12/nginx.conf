# TLS 1.2-only reverse proxy in front of Bindplane. It stands in for a
# load balancer that does not support TLS 1.3 (issue #195).
events {}

http {
  server {
    listen 3002 ssl;

    ssl_certificate     /etc/nginx/tls/bindplane.crt;
    ssl_certificate_key /etc/nginx/tls/bindplane.key;
    ssl_protocols       TLSv1.2;

    location / {
      proxy_pass https://bindplane:3001;
      proxy_ssl_verify off;
      proxy_set_header Host $host;
    }
  }
}
